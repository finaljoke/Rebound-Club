<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>美术样板 · 卡通动感竞技风</title>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
<style>
  :root{--ink:#0d1022;--orange:#ff6a2b;--teal:#1ec8b4;--gold:#ffd23a}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#070b1d;color:#fff;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;touch-action:none;user-select:none}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  .tag{max-width:calc(100% - 150px);position:fixed;left:max(14px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));padding:8px 12px;border-radius:12px;background:rgba(10,14,36,.62);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12)}
  .tag b{display:block;font-size:15px;font-weight:900;font-style:italic;letter-spacing:.02em}
  .tag span{display:block;font-size:11px;opacity:.7;margin-top:2px}
  .bar{position:fixed;right:max(14px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:8px;align-items:flex-end}
  .bar button,.bar a{font:inherit;font-size:12px;font-weight:700;color:#fff;text-decoration:none;padding:8px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:rgba(10,14,36,.62);backdrop-filter:blur(6px);cursor:pointer}
  .bar .on{background:var(--orange);border-color:var(--orange);color:var(--ink)}
  .call{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%) scale(.4) skewX(-8deg);font-size:clamp(44px,13vw,96px);font-weight:900;font-style:italic;letter-spacing:.02em;
    color:#fff;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink),0 0 30px rgba(255,180,60,.5);opacity:0;pointer-events:none;white-space:nowrap}
  .call.goal{color:var(--gold)}.call.save{color:#9fe3ff}.call.miss{color:#ff8a8a;font-size:clamp(36px,10vw,72px)}.call.hit{color:var(--orange);font-size:clamp(32px,9vw,64px);top:46%}
  .call.show{animation:pop 1.1s cubic-bezier(.2,1.6,.4,1) forwards}
  @keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4) skewX(-8deg)}14%{opacity:1;transform:translate(-50%,-50%) scale(1.12) skewX(-8deg)}26%{transform:translate(-50%,-50%) scale(1) skewX(-8deg)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%) scale(1) skewX(-8deg)}}
  .pad{position:fixed;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;padding:0 max(14px,env(safe-area-inset-left));pointer-events:none}
  .pad div{display:flex;gap:10px}
  .pad button{pointer-events:auto;width:64px;height:64px;border-radius:50%;border:none;font:inherit;font-size:22px;font-weight:900;color:var(--ink);background:#f4f1ea;box-shadow:0 5px 0 rgba(0,0,0,.45)}
  .pad button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.45)}
  .pad .hit{width:84px;height:84px;font-size:18px;background:var(--orange)}
  .keys{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);width:max-content;max-width:92vw;text-align:center;font-size:12px;opacity:.6}
  @media (pointer:coarse){.keys{display:none}}
  @media (pointer:fine){.pad{display:none}}
  #loading{position:fixed;inset:0;display:grid;place-items:center;font-weight:700;background:#070b1d}
  #loading[hidden]{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="tag"><b>美术样板 · 卡通动感竞技风</b><span>占位角色 KayKit（CC0）· 只看画面与动作，规则与正式版无关</span></div>
<div class="bar"><button id="mode">自动演示</button><button id="slow">慢动作</button><a href="./" target="_blank">打开旧版对比</a></div>
<div id="call" class="call"></div>
<div class="pad"><div><button data-k="left" aria-label="向左">◀</button><button data-k="right" aria-label="向右">▶</button></div><div><button class="hit" data-k="hit">挥击</button></div></div>
<div class="keys">← → 移动 · 空格挥击（击中时按住方向决定射向）· S 慢动作</div>
<div id="loading">正在加载角色…</div>
<script type="module" src="./spike/main.mjs"></script>
</body>
</html>
